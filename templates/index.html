<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnScan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🔍 VulnScan</h1>
        <p class="subtitle">Enter a target you own or are authorized to test, then choose what to run.</p>

        <form action="/scan" method="post">
            <input
                type="text"
                name="target"
                placeholder="e.g. scanme.nmap.org or http://testphp.vulnweb.com"
                required
            >

            <div class="checkboxes">
                <label><input type="checkbox" name="scans" value="network" checked> Port Scan</label>
                <label><input type="checkbox" name="scans" value="web" checked> Web Vulnerabilities</label>
                <label><input type="checkbox" name="scans" value="ssl"> SSL Certificate Check</label>
                <label><input type="checkbox" name="scans" value="tech"> Technology Detection</label>
            </div>

            <button type="submit">Run Scan</button>
        </form>

        <p class="disclaimer">
            ⚠ Only scan systems you own or have explicit permission to test.
        </p>
    </div>
</body>
</html>
